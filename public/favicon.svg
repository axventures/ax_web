<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
 
  <!-- rounded square base -->
  <rect x="20" y="20" width="472" height="472" rx="110" ry="110" fill="url(#bg)" filter="url(#shadow)"/>
 
  <!-- Monogram: both letters same serif family -->
  <g font-family="Georgia, 'Times New Roman', 'Playfair Display', serif" font-weight="700">
    <text x="185" y="335" font-size="255" text-anchor="middle" fill="#141416">A</text>
    <text x="330" y="335" font-size="255" text-anchor="middle" fill="#1F3AE0">X</text>
  </g>
</svg>
